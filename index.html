<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Hero LCP image: the tall left-hand frame of the hero wall, the one tile
         that is visible and large at every breakpoint.
         imagesizes MUST match the `sizes` for this tile in heroTiles.js, or the
         browser fetches a second copy at a different width. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/home/neon-couple-portrait-480.avif"
      imagesrcset="/images/home/neon-couple-portrait-480.avif 480w, /images/home/neon-couple-portrait-768.avif 768w, /images/home/neon-couple-portrait-1200.avif 1200w, /images/home/neon-couple-portrait-1440.avif 1440w"
      imagesizes="(max-width: 639px) 46vw, 24vw"
    />

    <title>Home | GCCC Ibadan</title>
    <meta
      content="Glory Center Community Church, Ibadan, is a God ordained ministry, and the proof is in the signs and wonders following, fulfilled prophecies and transformed lives. Don't take our word for it, come see for yourself"
      name="description"
    />
    <link rel="icon" href="/favicon/favicon.ico" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon/favicon-32x32.png"
    />
    <!-- IE -->
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="/favicon/apple-touch-icon.png"
    />
    <!-- iPhone -->
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="192x192"
      href="/favicon/android-chrome-192x192.png"
    />
    <!-- iPad -->
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="512x512"
      href="/favicon/android-chrome-512x512.png"
    />
    <meta content="Church, religion" name="keywords" />

    <!-- Mobile browser chrome colour -->
    <meta name="theme-color" content="#0998d5" />

    <link rel="icon" type="image/png" href="/favicon.ico" />
  </head>

  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
